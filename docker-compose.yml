x-backend-image: &backend-image job-tracker-api:day5

x-backend-environment: &backend-environment
  NODE_ENV: production
  DATABASE_URL: postgres://app:app@postgres:5432/job_tracker
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:18
    container_name: backend-intensive-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: job_tracker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d job_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: backend-intensive-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: backend-intensive-adminer
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: *backend-image
    build:
      context: .
    environment:
      <<: *backend-environment
      PORT: "3000"
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in local environment}
      LAB_ORIGIN: ${LAB_ORIGIN:-http://127.0.0.1:5173}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - type: bind
        source: ./var/exports
        target: /app/var/exports
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "dist/src/tools/healthcheck.js"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 45s
    
  worker:
    image: *backend-image
    command: ["node", "dist/src/workers/export.worker.js"]
    environment: *backend-environment
    volumes:
      - type: bind
        source: ./var/exports
        target: /app/var/exports
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 45s

  web:
    image: nginx:1.28-alpine
    profiles: ["static"]
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - type: bind
        source: ./web/dist
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./deploy/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false

    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
